# Shared by every exercise module: the serialization compiler plug-in and the
# same experimental flags the deck's build.gradle.kts enables.
dependencies:
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0

settings:
  kotlin:
    serialization: json
    freeCompilerArgs:
      - "-Xcontext-parameters"
      - "-Xcollection-literals"
      # The typed authentication API is experimental in Ktor 3.6.0.
      - "-opt-in=io.ktor.utils.io.ExperimentalKtorApi"
