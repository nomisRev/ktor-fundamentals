dependencies:
  - io.ktor:ktor-server-core:3.5.2
  - io.ktor:ktor-server-resources:3.5.2
  - io.ktor:ktor-server-html-builder:3.5.2
  - io.ktor:ktor-server-status-pages:3.5.2
